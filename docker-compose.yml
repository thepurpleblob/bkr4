services:
    bkrailway:
        container_name: "${PROJECT_NAME}_web"
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - ${WEB_PORT}:80
        restart: always
    directus:
        image: directus/directus:11.15.0
        container_name: "${PROJECT_NAME}_directus"
        ports:
            - ${DIRECTUS_PORT}:8055
        restart: always
        volumes:
            - ${DIRECTUS_DATABASE}:/directus/database
            - ${DIRECTUS_UPLOADS}:/directus/uploads
            - ${DIRECTUS_EXTENSIONS}:/directus/extensions
        environment:
            SECRET: "T&|A~1)9!V8.R+:o#C:&ZB[hT0&J;F"
            ADMIN_EMAIL: "admin@example.com"
            ADMIN_PASSWORD: "purple"
            DB_CLIENT: "sqlite3"
            DB_FILENAME: "/directus/database/database.sqlite"
            WEBSOCKETS_ENABLED: "true"
            CACHE_ENABLED: 'true'
            CACHE_STORE: 'redis'
            CACHE_AUTO_PURGE: "true"
            REDIS: 'redis://cache:6379'
            CONTENT_SECURITY_POLICY_DIRECTIVES__UPGRADE_INSECURE_REQUESTS: 'null'
            CORS_ENABLED: "true"
            CORS_ORIGIN: "true"
    cache:
        image: redis:6
        container_name: "${PROJECT_NAME}_cache"
        restart: always


        
