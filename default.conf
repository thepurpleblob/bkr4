server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;

    #access_log  /var/log/nginx/host.access.log  main;

    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /api/santa-availability {
        set $digitickets_backend digitickets:8080;
        proxy_pass http://$digitickets_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        error_page 500 502 503 504 = @santa_api_error;
    }

    location @santa_api_error {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"error":"Availability is temporarily unavailable."}';
    }

    location ~ ^/santa-availability-demo/?$ {
        root   /usr/share/nginx/html;
        rewrite ^ /index.html break;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~ ^/(page/[A-Za-z0-9_-]+|timetable|events|special|plan|faq|birkhill)/?$ {
        root   /usr/share/nginx/html;
        try_files /$1.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        #index  index.html index.htm;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}

